<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Formulir</title>
    <link rel="stylesheet" href="../static/css/style.css">
    
    <style>
        /* Gaya dasar untuk body dan layout */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container utama formulir */
        .form-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Judul formulir */
        .form-title {
            margin-bottom: 2rem;
            color: #333;
            font-size: 1.8rem;
        }

        /* Grup input dan label */
        .form-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        /* Label untuk input */
        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #555;
        }

        /* Input field */
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            border-color: #007bff;
            outline: none;
        }

        /* Tombol Kirim */
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Gaya untuk pesan error */
        .error {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Validasi Formulir</h2>

        <form id="myForm" class="validation-form" action="/proses_validasi" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="contoh@email.com">
                <span id="emailError" class="error"></span>
            </div>

            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="text" id="phone" name="phone" placeholder="08xxxxxxxxxx">
                <span id="phoneError" class="error"></span>
            </div>

            <button type="submit" class="btn">Kirim</button>
        </form>
    </div>

    <script src="../static/js/validation.js"></script>

    <script>
        // Mendengarkan event submit pada formulir
        document.getElementById('myForm').addEventListener('submit', function(event) {
            // Jalankan fungsi validasi dan cegah pengiriman jika validasi gagal
            if (!validateForm()) {
                event.preventDefault(); // Mencegah form dikirim ke server
            }
        });
    </script>
</body>
</html>
